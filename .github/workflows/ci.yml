name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.5.1", use-public-rspm: true }
      - name: Install R packages
        run: Rscript -e 'install.packages(c("QCA","SetMethods","plumber","jsonlite","testthat"))'
      - name: R tests (determinism, known answers)
        run: cd rservice && Rscript tests/testthat.R
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && ruff check . && mypy app && pytest
