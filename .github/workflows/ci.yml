name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.5.1", use-public-rspm: true }
      - name: Install R packages
        run: Rscript -e 'install.packages(c("QCA","SetMethods","plumber","jsonlite","testthat"))'
      - name: R tests (determinism, known answers)
        run: cd rservice && Rscript tests/testthat.R
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.5.1", use-public-rspm: true }
      - run: Rscript -e 'install.packages(c("QCA","jsonlite"))'
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && ruff check . && mypy app && pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run lint && npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo image
        run: docker build -t sa-qca-demo .
      - name: Run it and smoke-test
        run: |
          docker run -d --name sa -p 7860:7860 sa-qca-demo
          for i in $(seq 1 30); do curl -fsS localhost:7860/health && break; sleep 2; done
          bash deploy/smoke.sh http://localhost:7860 || { docker logs sa | tail -50; exit 1; }
