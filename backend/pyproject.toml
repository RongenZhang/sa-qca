[project]
name = "sa-qca-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2", "jsonschema>=4", "jinja2>=3", "sqlalchemy>=2", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "types-jsonschema"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.domain" = ["templates/*.j2"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E701"]
